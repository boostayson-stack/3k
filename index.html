<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>3K Jewelry Store | حسابات الذهب</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211f;
      --muted: #78817c;
      --gold: #c99d36;
      --gold-dark: #94701f;
      --gold-soft: #fbf3dc;
      --cream: #f7f6f1;
      --surface: #fff;
      --line: #e8e7df;
      --green: #237b57;
      --red: #b94a48;
      --shadow: 0 14px 40px #17211f12;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--cream); color: var(--ink); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .top-help { padding: 8px 18px; text-align: center; color: #e7e1d1; background: #101a19; font-size: 13px; }
    .top-help a { color: #f1cf75; text-decoration: none; font-weight: 700; }
    .topbar {
      position: sticky; top: 0; z-index: 5; height: 74px; display: flex; align-items: center;
      justify-content: space-between; padding: 10px max(20px, calc((100% - 1220px) / 2));
      background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 3px 14px #00000008;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 220px; }
    .brand img { width: 52px; height: 52px; object-fit: contain; display: block; }
    .brand-name { font-weight: 800; font-size: 16px; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .top-center { text-align: center; color: var(--gold-dark); font-size: 12px; font-weight: 700; }
    .top-center .coin { display: block; font-size: 23px; margin-bottom: 2px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button { border: 1px solid var(--line); background: white; border-radius: 11px; width: 42px; height: 42px; font-size: 18px; }
    .layout { max-width: 1220px; margin: 22px auto 50px; padding: 0 18px; display: grid; grid-template-columns: 235px minmax(0, 1fr); gap: 22px; }
    .sidebar { background: white; border: 1px solid var(--line); border-radius: 18px; padding: 16px 12px; align-self: start; position: sticky; top: 94px; }
    .side-title { color: var(--muted); font-size: 12px; padding: 4px 10px 12px; }
    .nav-list { display: grid; gap: 4px; }
    .nav-btn { border: 0; background: transparent; padding: 11px 12px; color: #525b57; text-align: right; border-radius: 11px; display: flex; align-items: center; gap: 10px; transition: .15s ease; }
    .nav-btn:hover { background: #f8f4e8; color: var(--gold-dark); }
    .nav-btn.active { color: #705414; background: var(--gold-soft); font-weight: 700; }
    .nav-btn .nav-icon { width: 23px; text-align: center; font-size: 17px; }
    .account { border-top: 1px solid var(--line); margin-top: 14px; padding: 14px 9px 3px; font-size: 12px; color: var(--muted); }
    .account strong { display: block; color: var(--ink); margin-top: 5px; font-size: 13px; }
    main { min-width: 0; }
    .subscription { border: 1px solid #eadcae; background: #fff9e9; color: #795e1e; padding: 11px 15px; border-radius: 12px; font-size: 13px; margin-bottom: 16px; }
    .page-head { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin: 4px 0 16px; }
    h1 { font-size: 21px; margin: 0; }
    .head-actions { display: flex; gap: 8px; }
    .btn { border: 1px solid var(--line); background: white; padding: 10px 14px; border-radius: 10px; color: var(--ink); font-weight: 650; }
    .btn:hover { border-color: var(--gold); }
    .btn-primary { background: linear-gradient(135deg, #d9b746, #b88819); color: #201a0b; border-color: transparent; box-shadow: 0 5px 13px #c99d3633; }
    .btn-primary:hover { filter: brightness(1.03); border-color: transparent; }
    .filters { display: flex; flex-wrap: wrap; gap: 7px; padding: 4px 0 16px; }
    .filter-btn { border: 1px solid var(--line); background: white; color: #626a66; padding: 7px 13px; border-radius: 20px; font-size: 13px; }
    .filter-btn.active { background: var(--ink); color: white; border-color: var(--ink); }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .stat-card { border-radius: 17px; padding: 16px 17px; background: white; border: 1px solid var(--line); box-shadow: 0 4px 12px #17211f06; }
    .stat-card.gold { background: #fff9dc; border-color: #e9d480; }
    .stat-card.blue { background: #edf5fd; border-color: #c8dcec; }
    .stat-title { font-weight: 750; margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 14px; }
    .stat-row { padding-top: 8px; margin-top: 8px; border-top: 1px dashed #cfcfc3; display: flex; justify-content: space-between; align-items: center; color: #64706a; font-size: 13px; }
    .stat-row strong { color: var(--ink); font-size: 14px; direction: ltr; }
    .search { margin: 14px 0; position: relative; }
    .search input { width: 100%; height: 47px; padding: 0 15px; background: white; border: 1px solid var(--line); border-radius: 12px; outline: none; }
    .search input:focus, input:focus, select:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px #c99d3622; }
    .table-wrap { background: white; border: 1px solid var(--line); border-radius: 15px; overflow: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 650px; }
    th, td { padding: 13px 15px; text-align: right; border-bottom: 1px solid #f0efe9; font-size: 13px; }
    th { color: var(--muted); background: #fbfaf6; font-weight: 650; }
    tr:last-child td { border-bottom: 0; }
    .badge { display: inline-block; padding: 4px 9px; border-radius: 20px; background: #edf6ef; color: var(--green); font-size: 11px; }
    .empty { margin-top: 14px; text-align: center; padding: 54px 15px 40px; background: white; border: 1px solid var(--line); border-radius: 16px; }
    .empty-icon { font-size: 39px; margin-bottom: 13px; }
    .empty p { margin: 0 0 18px; color: var(--muted); }
    .mobile-nav { display: none; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 10; background: #101a1970; display: grid; place-items: center; padding: 16px; }
    .modal { width: min(540px, 100%); background: white; border-radius: 18px; box-shadow: var(--shadow); max-height: 92vh; overflow: auto; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .close-btn { border: 0; background: transparent; font-size: 22px; color: var(--muted); }
    .modal-body { padding: 18px 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { display: grid; gap: 6px; font-size: 13px; color: #505954; }
    .field.full { grid-column: 1 / -1; }
    .field input, .field select, .field textarea { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; outline: none; background: white; }
    .form-footer { display: flex; gap: 8px; justify-content: flex-start; margin-top: 18px; }
    .toast { position: fixed; z-index: 20; bottom: 20px; left: 20px; background: #17211f; color: white; padding: 12px 17px; border-radius: 10px; box-shadow: var(--shadow); }
    .settings-card { background: white; border: 1px solid var(--line); border-radius: 15px; padding: 19px; margin-bottom: 12px; }
    .settings-card h3 { margin: 0 0 8px; font-size: 16px; }
    .settings-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .permission-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; margin-top: 12px; }
    .permission-option { display: flex; align-items: center; gap: 9px; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; color: #505954; font-size: 13px; cursor: pointer; }
    .permission-option input { width: 17px; height: 17px; accent-color: var(--gold-dark); }
    @media (max-width: 760px) {
      .topbar { height: 66px; padding: 8px 12px; }
      .top-help { font-size: 11px; padding: 7px; }
      .brand { min-width: 0; gap: 8px; }
      .brand img { width: 43px; height: 43px; }
      .brand-name { font-size: 13px; }
      .brand-sub { font-size: 10px; }
      .top-center { font-size: 10px; }
      .top-center .coin { font-size: 18px; }
      .top-actions .icon-button { width: 36px; height: 36px; }
      .layout { display: block; margin: 14px auto 78px; padding: 0 12px; }
      .sidebar { display: none; }
      .subscription { font-size: 12px; }
      .page-head { align-items: flex-start; }
      h1 { font-size: 18px; padding-top: 7px; }
      .head-actions .btn { padding: 9px 10px; font-size: 12px; }
      .stats { gap: 8px; }
      .stat-card { padding: 12px 10px; border-radius: 13px; }
      .stat-title { font-size: 12px; }
      .stat-row { font-size: 11px; gap: 5px; }
      .stat-row strong { font-size: 12px; }
      .empty { padding: 40px 12px 30px; }
      .mobile-nav { position: fixed; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 20px #0000000a; padding: 5px 4px calc(5px + env(safe-area-inset-bottom)); }
      .mobile-nav .nav-btn { text-align: center; justify-content: center; flex-direction: column; gap: 2px; padding: 4px 2px; font-size: 10px; border-radius: 9px; }
      .mobile-nav .nav-icon { font-size: 18px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
    .sidebar-open { display: block; position: fixed !important; z-index: 8; top: 78px; right: 12px; left: 12px; max-height: calc(100vh - 100px); overflow: auto; box-shadow: var(--shadow); }
    .stats-three { grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 14px 0; }
    .stats-three > .stat-card, .compact-stats > div { display: grid; gap: 8px; }
    .stats-three > .stat-card > strong, .compact-stats strong { font-size: 18px; }
    .compact-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 14px 0; }
    .compact-stats > div { border-radius: 12px; background: #f8f6ef; padding: 12px; color: var(--muted); font-size: 12px; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.7; }
    .block { display: block; }
    .badge-warning { color: #805711; background: #fff3d4; }
    .table-link { border: 0; padding: 0; color: #795e1e; background: transparent; text-decoration: underline; font-weight: 700; }
    .btn-small { padding: 6px 9px; font-size: 12px; }
    .date-filter { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; margin: 8px 0 14px; color: var(--muted); font-size: 13px; }
    .date-filter label { display: grid; gap: 5px; }
    .date-filter input { min-height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: white; }
    .date-filter strong { margin-right: auto; color: var(--ink); }
    .form-tabs { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 13px; }
    .form-tabs button { border: 1px solid var(--line); background: white; border-radius: 9px; color: #535c57; padding: 9px 12px; }
    .form-tabs button.active { background: var(--gold-soft); border-color: #e6d18b; color: #705414; font-weight: 700; }
    .form-tabs.compact { padding: 0; border: 0; margin: 4px 0 0; }
    .customer-fields { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fbfaf6; }
    .customer-fields h3, .form-panel h3, .line-list h3 { margin: 0 0 12px; font-size: 15px; }
    .form-panel { padding: 15px; border: 1px solid var(--line); border-radius: 13px; margin: 12px 0; background: white; }
    .form-panel .form-grid { align-items: end; }
    .dialog-wide { min-width: 0; }
    .modal:has(.dialog-wide) { width: min(860px, 100%); }
    .modal:has(.dialog-wide) .modal-body { max-height: calc(92vh - 60px); overflow: auto; }
    .line-list { padding: 8px 4px; }
    .line-item { display: grid; grid-template-columns: minmax(0, 1fr) auto 34px; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .line-item small { display: block; color: var(--muted); margin-top: 4px; }
    .line-total { text-align: left; font-weight: 700; color: var(--gold-dark); }
    .remove-line { border: 1px solid #f0d7d4; color: var(--red); background: #fff8f7; border-radius: 8px; width: 31px; height: 31px; }
    .totals-preview { background: #fff9e9; border-color: #eadcae; font-size: 14px; }
    .summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-bottom: 15px; }
    .summary-grid > div { display: grid; gap: 7px; padding: 12px; border-radius: 10px; background: #f8f7f2; color: var(--muted); font-size: 12px; }
    .summary-grid strong { color: var(--ink); font-size: 15px; }
    .summary-grid .summary-primary { background: var(--gold-soft); color: #705414; }
    .check-field { display: flex; align-items: center; gap: 8px; }
    .check-field input { width: 18px; min-height: auto; height: 18px; accent-color: var(--gold-dark); }
    .transaction-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .choice-card { min-height: 70px; border: 1px solid var(--line); background: #fbfaf6; border-radius: 12px; font-weight: 700; color: var(--ink); }
    .choice-card:hover { border-color: var(--gold); background: var(--gold-soft); }
    .inline-form { display: flex; gap: 8px; margin: 14px 0 4px; }
    .inline-form input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
    #print-sheet { display: none; }
    #print-sheet header { display: flex; align-items: center; gap: 14px; border-bottom: 2px solid #c99d36; padding-bottom: 15px; }
    #print-sheet header img { width: 65px; height: 65px; object-fit: contain; }
    #print-sheet h1, #print-sheet h2 { color: #17211f; }
    #print-sheet table { margin: 18px 0; }
    @media print {
      body * { visibility: hidden !important; }
      #print-sheet, #print-sheet * { visibility: visible !important; }
      #print-sheet { display: block !important; position: fixed; inset: 0; background: #fff; color: #111; padding: 16mm; direction: rtl; font-family: Tahoma, Arial, sans-serif; }
      #print-sheet .summary-grid { margin-top: 20px; }
    }
    @media (max-width: 760px) {
      .stats-three, .compact-stats { grid-template-columns: 1fr; }
      .line-item { grid-template-columns: minmax(0, 1fr) auto 30px; gap: 6px; padding: 9px 3px; }
      .summary-grid { gap: 7px; }
      .transaction-choices { grid-template-columns: 1fr; }
      .inline-form { flex-wrap: wrap; }
      .sidebar-open { top: 72px; }
    }
  </style>
</head>
<body>
  <div class="top-help">للمساعدة أو الاستفسار تواصل معنا <a href="tel:01000000000">0100 000 0000</a></div>
  <header class="topbar">
    <div class="brand">
      <img src="3K%20photo.png" alt="شعار 3K Jewelry Store">
      <div><div class="brand-name">3K Jewelry Store</div><div class="brand-sub">نظام حسابات الذهب</div></div>
    </div>
    <div class="top-center"><span class="coin">🪙</span>حسابات محلك في مكان واحد</div>
    <div class="top-actions">
      <button class="icon-button" id="install-button" title="تثبيت 3K على الجهاز" aria-label="تثبيت 3K على الجهاز">📲</button>
      <button class="icon-button" id="backup-button" title="نسخة احتياطية" aria-label="نسخة احتياطية">💾</button>
      <button class="icon-button" id="menu-button" title="القائمة" aria-label="القائمة">☰</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-title">القائمة الرئيسية</div>
      <nav class="nav-list" id="side-nav"></nav>
      <div class="account">المحل<strong>3K Jewelry Store</strong></div>
    </aside>
    <main id="main-content"></main>
  </div>
  <nav class="mobile-nav" id="mobile-nav"></nav>
  <div id="overlay-root"></div>
  <script src="app.js"></script>
</body>
</html>
